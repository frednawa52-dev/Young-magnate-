<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Young Magnate | Football Predictions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Young Magnate</h1>
    <p>Daily Expert Football Tips &bull; Live Auto-Updates</p>
  </header>

  <div class="container" id="predictions-list">
    <p style="text-align:center; color:#94a3b8;">Loading today's predictions...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig ={
  apiKey: "AIzaSyDFy9lpQ5Zb4uB0VjRGwzrhuUlWqDTwlPU",
  authDomain: "young-magnate-43.firebaseapp.com",
  projectId: "young-magnate-43",
  storageBucket: "young-magnate-43.firebasestorage.app",
  messagingSenderId: "813734397364",
  appId: "1:813734397364:web:09ba7ea4fb8b27bbfcdee1"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const list = document.getElementById("predictions-list");

    const q = query(collection(db, "predictions"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      list.innerHTML = "";
      if (snapshot.empty) {
        list.innerHTML = "<p style='text-align:center;'>No predictions posted yet today.</p>";
        return;
      }
      snapshot.forEach((doc) => {
        const data = doc.data();
        list.innerHTML += `
          <div class="card">
            <div>
              <div class="league">${data.league} &bull; ${data.kickoff}</div>
              <div class="teams">${data.match}</div>
              <div class="pick">Tip: <strong>${data.tip}</strong> (Odds: ${data.odds})</div>
            </div>
            <div class="status ${data.status}">${data.status}</div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
